<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>UI contact sheet</title>
<style>
body{margin:0;padding:24px;background:#16181c;color:#dfe2e6;font:13px/1.5 "Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;margin:40px 0 12px;color:#858c95}
h3{font-size:13px;margin:0 0 8px}
nav{display:flex;flex-wrap:wrap;gap:4px 12px;margin:12px 0 0}
nav a{color:#449eff;text-decoration:none}
article{margin:0 0 32px;padding-top:16px;border-top:1px solid #383d44}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
figure{margin:0}
figcaption{font-size:11px;color:#858c95;margin-bottom:4px}
img{max-width:100%;height:auto;border:1px solid #383d44;display:block}
.none{color:#646a73}
</style>
<h1>UI contact sheet</h1>
<p>3 states. Click an image for full size.</p>
<nav><a href="#desk-no-selection">desk no-selection</a><a href="#desk-no-selection-light">desk no-selection (light)</a><a href="#laptop-no-selection">laptop no-selection</a></nav>

<section>
<h2>desk</h2>
<article id="desk-no-selection"><h3>desk no-selection</h3><div class="pair"><figure><figcaption>Before</figcaption><a href="panel-reset-before/desk-no-selection.png"><img loading="lazy" src="panel-reset-before/desk-no-selection.png" alt=""></a></figure><figure><figcaption>After</figcaption><a href="panel-reset-after/desk-no-selection.png"><img loading="lazy" src="panel-reset-after/desk-no-selection.png" alt=""></a></figure></div></article>
<article id="desk-no-selection-light"><h3>desk no-selection (light)</h3><div class="pair"><figure><figcaption>Before</figcaption><a href="panel-reset-before/desk-no-selection-light.png"><img loading="lazy" src="panel-reset-before/desk-no-selection-light.png" alt=""></a></figure><figure><figcaption>After</figcaption><a href="panel-reset-after/desk-no-selection-light.png"><img loading="lazy" src="panel-reset-after/desk-no-selection-light.png" alt=""></a></figure></div></article>
</section>

<section>
<h2>laptop</h2>
<article id="laptop-no-selection"><h3>laptop no-selection</h3><div class="pair"><figure><figcaption>Before</figcaption><a href="panel-reset-before/laptop-no-selection.png"><img loading="lazy" src="panel-reset-before/laptop-no-selection.png" alt=""></a></figure><figure><figcaption>After</figcaption><a href="panel-reset-after/laptop-no-selection.png"><img loading="lazy" src="panel-reset-after/laptop-no-selection.png" alt=""></a></figure></div></article>
</section>
</html>
