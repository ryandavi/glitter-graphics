<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#292d33; --workspace:#191c20; --card:#2e3339; --sunk:#212429;
      --border:#383d44; --border-hi:#474d55;
      --t1:#dfe2e6; --t2:#858c95; --t3:#646a73; --accent:#007bff; --accent-surface:rgba(0,123,255,.16);
      --pad:8px; --r-panel:8px; --r-card:6px; --r-field:4px; --r-inner:3px;
    }
    *{box-sizing:border-box}
    button{font:inherit;color:inherit}
    body{margin:0;background:var(--workspace);color:var(--t1);font-family:"Segoe UI","Tahoma","Verdana",sans-serif;-webkit-font-smoothing:antialiased}
    .wrap{padding:24px;display:flex;justify-content:center;gap:26px;align-items:flex-start}
    .panel{width:404px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden;display:flex;flex-direction:column}
    .phead{display:flex;align-items:center;gap:8px;height:34px;padding:0 var(--pad);
      background-image:linear-gradient(to top,#212429 55%,#3c424a 100%);border-bottom:1px solid var(--border);
      color:#fff;text-shadow:0 1px 1px #000;font-size:13px;font-weight:600}
    .phead .sp{flex:1 1 auto}
    .phead svg{width:14px;height:14px;opacity:.85}
    .abh{display:flex;align-items:center;gap:6px;height:30px;padding:0 var(--pad);border-bottom:1px solid var(--border);background:var(--sunk)}
    .abh .title{font-size:12px;font-weight:600;color:var(--t1);flex:1}
    .abh .count{font-size:11px;color:var(--t3)}
    .searchrow{display:flex;gap:6px;padding:var(--pad)}
    .searchbox{flex:1;display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;background:var(--sunk);
      border:1px solid var(--border);border-radius:var(--r-field);font-size:12px;color:var(--t3)}
    .searchbox svg{width:12px;height:12px;color:var(--t3);flex:0 0 auto}
    .filterbtn{display:flex;align-items:center;gap:4px;height:28px;padding:0 10px;background:var(--sunk);
      border:1px solid var(--border);border-radius:var(--r-field);font-size:11px;font-weight:500;color:var(--t2);cursor:pointer}
    .filterbtn svg{width:13px;height:13px}
    .chiprow{display:flex;flex-wrap:wrap;gap:6px;padding:0 var(--pad) 8px}
    .chip{height:24px;padding:0 10px;display:flex;align-items:center;background:var(--sunk);border:1px solid var(--border);
      border-radius:9999px;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer}
    .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
    .grouplabel{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);padding:8px var(--pad) 6px}
    .body-b{padding:0 var(--pad) var(--pad);overflow:auto}
    .cathead{display:flex;align-items:baseline;gap:6px;padding:10px 0 6px}
    .cathead b{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t3)}
    .cathead i{font-size:10px;font-style:normal;color:var(--t3)}
    .catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
    .cat{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;cursor:pointer}
    .cat:hover{border-color:var(--border-hi)}
    .cat .montage{height:56px;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;justify-items:center;color:var(--t2);background:var(--sunk)}
    .cat .montage svg{width:20px;height:20px}
    .cat .lbl{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:6px 8px}
    .cat .lbl b{font-size:12px;font-weight:600}
    .cat .lbl i{font-size:10px;font-style:normal;color:var(--t3)}
    .credit{margin:2px 0 6px;padding:7px 8px;background:var(--sunk);border:1px solid var(--border);border-radius:var(--r-inner)}
    .credit .ch{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-bottom:3px}
    .credit p{margin:0;font-size:11px;color:var(--t2);line-height:1.45}
    .credit a{color:var(--accent);text-decoration:none}
    .backline{display:flex;align-items:center;gap:6px;padding:8px 0 4px;font-size:11px;color:var(--t2)}
    .backline svg{width:12px;height:12px}
    .setname{font-size:12px;font-weight:600;color:var(--t1);padding:6px 0 2px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .item{display:flex;flex-direction:column;gap:3px;cursor:pointer}
    .item .th{aspect-ratio:1;border-radius:var(--r-inner);border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--t2)}
    .item.on .th{outline:2px solid var(--accent);outline-offset:1px;color:var(--t1)}
    .item .th svg{width:60%;height:60%}
    .item .nm{font-size:9.5px;color:var(--t3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  </style>
</helmet>

<div class="wrap">

  <!-- SHAPES -->
  <div class="panel">
    <div class="phead">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="10" height="10" rx="2.5"/></svg>
      <span class="sp">Shapes</span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
    </div>
    <div class="abh"><span class="title">Shapes</span><span class="count">48</span></div>
    <div class="searchrow">
      <div class="searchbox"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M11 11l3 3"/></svg>Search shapes</div>
      <button class="filterbtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M4 8h8M6 12h4"/></svg>Filter</button>
    </div>
    <div class="body-b">
      <!-- small curated set: every category shown, grouped under a header. no folders. -->
      <div class="cathead"><b>Basic</b><i>8</i></div>
      <div class="grid">
        <div class="item on"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="7" width="18" height="10" rx="4"/></svg></span><span class="nm">Rounded rect</span></div>
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16"/></svg></span><span class="nm">Square</span></div>
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg></span><span class="nm">Circle</span></div>
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 16H3z"/></svg></span><span class="nm">Triangle</span></div>
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 6-9 6-9-6z"/></svg></span><span class="nm">Diamond</span></div>
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5-8-11a5 5 0 0 1 8-3 5 5 0 0 1 8 3c0 6-8 11-8 11z"/></svg></span><span class="nm">Heart</span></div>
      </div>
      <div class="cathead"><b>Stars &amp; bursts</b><i>10</i></div>
      <div class="grid">
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg></span><span class="nm">Star 5</span></div>
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg></span><span class="nm">Sparkle</span></div>
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2 8 8-2-6 6 6 6-8-2-2 8-2-8-8 2 6-6-6-6 8 2z"/></svg></span><span class="nm">Burst</span></div>
      </div>
      <div class="cathead"><b>Banners &amp; speech</b><i>9</i></div>
      <div class="grid">
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16v10H8l-4 4z"/></svg></span><span class="nm">Speech</span></div>
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v10l-3-2-3 2-3-2-3 2-3-2-3 2z"/></svg></span><span class="nm">Banner</span></div>
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h9l3 3v15H6z"/></svg></span><span class="nm">Tag</span></div>
      </div>
    </div>
  </div>

  <!-- BRUSH TIPS -->
  <div class="panel">
    <div class="phead">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13c2-1 3-4 6-7s5-3 5-3l-1 4c-1 1-4 3-6 5s-4 1-4 1z"/></svg>
      <span class="sp">Brush Tips</span>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
    </div>
    <div class="abh"><span class="title">Brush Tips</span><span class="count">32</span></div>
    <div class="searchrow">
      <div class="searchbox"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M11 11l3 3"/></svg>Search tips</div>
      <button class="filterbtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M4 8h8M6 12h4"/></svg>Filter</button>
    </div>
    <div class="body-b">
      <!-- basics are listed flat (as today); collections/sets are folders (like glitter) -->
      <div class="cathead"><b>Basic brushes</b><i>8</i></div>
      <div class="grid">
        <div class="item on"><span class="th" style="color:var(--t1)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg></span><span class="nm">Soft Round</span></div>
        <div class="item"><span class="th"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="3"/></svg></span><span class="nm">Hard Round</span></div>
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></span><span class="nm">Square</span></div>
        <div class="item"><span class="th"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="12" r="4"/><circle cx="15" cy="12" r="3"/></svg></span><span class="nm">Dual Dab</span></div>
      </div>

      <div class="cathead"><b>Brush sets</b><i>5</i></div>
      <div class="catgrid">
        <div class="cat">
          <div class="montage">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-8-5-8-11a5 5 0 0 1 8-3 5 5 0 0 1 8 3c0 6-8 11-8 11z"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l2 5 5 .5-4 3.5 1.5 5-4.5-3-4.5 3 1.5-5-4-3.5 5-.5z"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="9" r="2"/><circle cx="15" cy="7" r="1.5"/><circle cx="12" cy="14" r="2.5"/></svg>
          </div>
          <div class="lbl"><b>bruisedxheart</b><i>12</i></div>
        </div>
        <div class="cat">
          <div class="montage">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 16c4 1 6-8 8-8s3 9 8 8"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="8" r="1.5"/><circle cx="12" cy="12" r="2.5"/><circle cx="18" cy="16" r="1.5"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 12c3-4 6 4 9 0s7-3 7-3-2 8-8 8-8-5-8-5z"/></svg>
          </div>
          <div class="lbl"><b>Watercolor</b><i>6</i></div>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
