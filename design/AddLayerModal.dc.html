<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#292d33; --workspace:#191c20; --card:#2e3339; --sunk:#212429;
      --border:#383d44; --border-hi:#474d55;
      --t1:#dfe2e6; --t2:#858c95; --t3:#646a73; --accent:#007bff;
      --pad:8px; --r-modal:10px; --r-card:6px; --r-field:4px;
    }
    *{box-sizing:border-box}
    button{font:inherit;color:inherit}
    body{margin:0;background:var(--workspace);color:var(--t1);font-family:"Segoe UI","Tahoma","Verdana",sans-serif;-webkit-font-smoothing:antialiased}
    .scrim{min-height:520px;display:flex;align-items:center;justify-content:center;padding:40px;
      background:rgba(10,11,14,.55)}
    .modal{width:360px;background:var(--bg);border:1px solid var(--border-hi);border-radius:var(--r-modal);
      box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden}
    .mh{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--border)}
    .mh h2{margin:0;font-size:14px;font-weight:700;flex:1}
    .mh .x{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--t3);
      background:none;border:0;border-radius:var(--r-field);cursor:pointer}
    .mh .x:hover{color:var(--t1);background:var(--sunk)}
    .mh .x svg{width:14px;height:14px}
    .mb{padding:16px}
    .mb .lead{font-size:12px;color:var(--t3);margin:0 0 12px;line-height:1.5}
    /* the Quick Add tile grid, shared with the No selection panel */
    .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
      min-height:84px;padding:14px 8px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);color:var(--t2);cursor:pointer}
    .tile:hover{border-color:var(--border-hi);color:var(--t1)}
    .tile.primary{border-color:var(--accent);color:var(--t1)}
    .tile svg{width:22px;height:22px}
    .tile .tt{display:flex;flex-direction:column;align-items:center;gap:1px}
    .tile b{font-size:12px;font-weight:600;line-height:1.2}
    /* subtext is a short centred column, not a full-width line */
    .tile .tt span{font-size:10px;color:var(--t3);line-height:1.25;text-align:center;max-width:16ch}
    .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
    .mf button{height:30px;padding:0 14px;font-size:12px;font-weight:500;border-radius:var(--r-field);cursor:pointer}
    .mf .cancel{background:var(--sunk);border:1px solid var(--border);color:var(--t2)}
  </style>
</helmet>

<div class="scrim">
  <div class="modal">
    <div class="mh">
      <h2>Add a layer</h2>
      <button class="x"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="mb">
      <p class="lead">Pick a layer type. It lands above the current layer.</p>
      <!-- tile label + subtext come verbatim from LAYER_UI_CONFIG[type].addableViaModal
           (label / description) in js/core/config.js. Keep this grid in sync with the
           Quick add grid in NoSelectionPanel.dc.html. -->
      <div class="tiles">
        <div class="tile primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 6h14M12 6v13"/></svg>
          <span class="tt"><b>Text</b><span>Fill editable text with glitter, color, or gradient</span></span>
        </div>
        <div class="tile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2l2.5 6.6L21 11l-6.5 2.4L12 20l-2.5-6.6L3 11l6.5-2.4z"/></svg>
          <span class="tt"><b>Sticker</b><span>Add images and graphics</span></span>
        </div>
        <div class="tile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="4"/></svg>
          <span class="tt"><b>Shape</b><span>Fill a shape with glitter, color, or gradient</span></span>
        </div>
        <div class="tile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s7 8 7 12a7 7 0 0 1-14 0c0-4 7-12 7-12z"/></svg>
          <span class="tt"><b>Fill Layer</b><span>Paint an animated or solid fill onto the image</span></span>
        </div>
      </div>
    </div>
    <div class="mf">
      <button class="cancel">Cancel</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
